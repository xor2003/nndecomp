[sdl]
fullscreen=false
vsync=false

[render]
aspect=false

[dosbox]
machine=svga_s3

[cpu]
cycles=20000

[autoexec]
mount c /home/xor/nndecomp/msex/motf
mount d /home/xor/nndecomp/msc60
path=%PATH%;D:\BIN
set INCLUDE=D:\INCLUDE
set LIB=D:\LIB
c:
echo Cleaning existing files...
del *.obj *.cod *.exe 2>nul
echo.

echo Testing mots1...
d:\bin\nmake /f mots1_msc.mak
echo Exit code: %ERRORLEVEL%
echo.

echo Testing motsho...
d:\bin\nmake /f motsho_msc.mak
echo Exit code: %ERRORLEVEL%
echo.

echo Testing tgui1...
d:\bin\nmake /f tgui1_msc.mak
echo Exit code: %ERRORLEVEL%
echo.

echo Testing tgui2...
d:\bin\nmake /f tgui2_msc.mak
echo Exit code: %ERRORLEVEL%
echo.

echo Testing tgui3...
d:\bin\nmake /f tgui3_msc.mak
echo Exit code: %ERRORLEVEL%
echo.

echo Testing mottest...
d:\bin\nmake /f mottest_msc.mak
echo Exit code: %ERRORLEVEL%
echo.

echo Final COD files:
dir *.cod
echo.
echo Test completed.
exit